<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Your Booking | J-ONE Hotel &amp; Lodge</title>
<meta name="description" content="Review your booking details and proceed to secure payment at J-ONE Hotel &amp; Lodge.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#373435">
<link rel="icon" href="favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
<link rel="stylesheet" href="css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>

</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand" aria-label="J-ONE Hotel &amp; Lodge — home">
      <span class="brand-mark-badge">
        <img src="assets/icons/logo-official.png" alt="" class="brand-mark">
      </span>
      <span>
        <span class="brand-word">J-ONE</span>
        <span class="brand-sub">Hotel &amp; Lodge</span>
      </span>
    </a>

    <nav class="header-nav" aria-label="Primary">
      <a class="nav-link" data-nav="index.html" href="index.html">Home</a>
      <a class="nav-link" data-nav="rooms.html" href="rooms.html">Rooms</a>
      <a class="nav-link" data-nav="facilities.html" href="facilities.html">Facilities</a>
      <a class="nav-link" data-nav="gallery.html" href="gallery.html">Gallery</a>
      <a class="nav-link" data-nav="offers.html" href="offers.html">Offers</a>
      <a class="nav-link" data-nav="about.html" href="about.html">About</a>
      <a class="nav-link" data-nav="contact.html" href="contact.html">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="icon-moon" data-icon="moon" data-size="20"></span>
        <span class="icon-sun" data-icon="sun" data-size="20"></span>
      </button>
      <a class="btn btn-sm btn-accent btn-book" href="booking.html">Book</a>
      <button class="btn-icon btn-outline menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-icon="menu" data-size="22"></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="container booking-shell">
    <!-- STEPPER (rendered by js/booking-stepper.js) -->
    <nav id="booking-stepper" aria-label="Booking progress"></nav>

    <div class="booking-layout">
      <div>
        <!-- STEP 3: GUEST INFORMATION -->
        <section id="panel-guest" class="bk-panel is-current">
          <form id="guest-form" class="card card-pad" novalidate>
            <h2 style="font-size:var(--fs-xl);margin-bottom:0.35rem;">Guest information</h2>
            <p class="muted" style="margin-bottom:1.5rem;font-size:var(--fs-sm);">Who should we prepare the reservation for?</p>
            <div class="form-grid fg-2">
              <div class="field">
                <label class="field-label" for="g-first">First name</label>
                <input class="input" id="g-first" name="first_name" required autocomplete="given-name">
                <div class="field-error">Please enter your first name.</div>
