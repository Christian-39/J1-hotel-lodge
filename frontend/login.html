<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Sign In | J-ONE Hotel &amp; Lodge</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#373435">
<link rel="icon" href="favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
<link rel="stylesheet" href="css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand" aria-label="J-ONE Hotel &amp; Lodge — home">
      <span class="brand-mark-badge">
        <img src="assets/icons/logo-official.png" alt="" class="brand-mark">
      </span>
      <span>
        <span class="brand-word">J-ONE</span>
        <span class="brand-sub">Hotel &amp; Lodge</span>
      </span>
    </a>

    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="icon-moon" data-icon="moon" data-size="20"></span>
        <span class="icon-sun" data-icon="sun" data-size="20"></span>
      </button>
      <a class="btn btn-sm btn-accent btn-book" href="booking.html">Book</a>
      <button class="btn-icon btn-outline menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-icon="menu" data-size="22"></button>
    </div>
  </div>
</header>

<main id="main" style="min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:var(--color-background);">
  <div style="width:100%;max-width:420px;">
    <div class="center" style="margin-bottom:2rem;">
      <h1 style="font-size:var(--fs-xl);margin-top:1rem;">Sign in</h1>
      <p class="muted">Hotel staff access only.</p>
    </div>

    <div class="card card-pad">
      <form id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email">
          <div class="field-error">Please enter your email.</div>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div style="position:relative;">
            <input class="input" id="password" name="password" type="password" required autocomplete="current-password" style="padding-right:2.6rem;">
            <button class="btn-icon btn-ghost" type="button" id="pw-toggle" aria-label="Show password" aria-pressed="false"
              style="position:absolute;right:0.15rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
              <span data-icon="eye" data-size="17"></span>
            </button>
          </div>
          <div class="field-error">Please enter your password.</div>
        </div>
        <div class="field-error" data-form-error style="display:none;color:var(--color-danger);margin-bottom:1rem;"></div>
        <button class="btn btn-block" type="submit">Sign in</button>
      </form>
      <p class="caption center" style="margin-top:1.5rem;">Guests can book and pay without creating an account.</p>
      <p class="caption center" style="margin-top:0.75rem;">
        <a href="index.html">&larr; Back to website</a>
      </p>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/hotel-data.js"></script>
<script src="js/contact.js"></script>
<script src="js/navigation.js"></script>
<script>
  JONE.ui.initChrome();
  // Already signed in? Staff accounts go directly to the console.
  if (window.Auth.isAuthenticated()) {
    window.Auth.restore();
    location.replace("dashboard/index.html");
  } else {
    window.Auth.bindLoginForm("#login-form");
  }
document.getElementById("pw-toggle").addEventListener("click", function () {
  var inp = document.getElementById("password");
  var show = inp.type === "password";
  inp.type = show ? "text" : "password";
  this.setAttribute("aria-label", show ? "Hide password" : "Show password");
  this.setAttribute("aria-pressed", show ? "true" : "false");
  this.innerHTML = '<span data-icon="' + (show ? "eyeOff" : "eye") + '" data-size="17"></span>';
  JONE.icons.inject(this);
});
</script>
</body>
</html>
