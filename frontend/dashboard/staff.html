<!doctype html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Staff | J-ONE</title><link rel="stylesheet" href="../css/main.css"><script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('jone.theme')||'light')})()</script></head><body><div class="dash"><aside class="dash-sidebar"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" width="30"><span><b class="brand-word">J-ONE</b><br><small class="brand-sub">Staff Console</small></span></div><nav class="dash-sidebar-nav" data-dash-nav></nav><div class="dash-sidebar-footer"><div data-dash-user></div><button class="btn btn-sm btn-outline" data-logout>Sign out</button></div></aside><main class="dash-main"><header class="dash-topbar"><div class="dash-topbar-left"><button class="btn-icon btn-outline dash-menu-toggle" data-icon="menu" aria-label="Open menu"></button><div class="dash-title"><h1>Staff management</h1><p>Create and manage managers and staff accounts</p></div></div><div class="dash-topbar-right"><button class="theme-toggle" type="button" aria-label="Toggle theme"><span data-icon="moon"></span></button></div></header><div class="dash-content"><section class="panel"><div class="panel-head"><h2>Staff accounts</h2><button class="btn btn-accent" data-new>New staff member</button></div><div class="filter-bar"><div class="field"><label class="field-label" for="q">Search</label><input class="input" id="q" placeholder="Name, email, phone"></div><div class="field"><label class="field-label" for="role">Role</label><select class="select" id="role"><option value="">All staff</option><option value="MANAGER">Managers</option><option value="RECEPTIONIST">Receptionists</option><option value="ADMIN">Administrators</option></select></div><div class="field"><label class="field-label" for="active">Status</label><select class="select" id="active"><option value="">All statuses</option><option value="true">Active</option><option value="false">Inactive</option></select></div></div><div class="panel-body no-pad"><div class="table-wrap"><table class="table"><thead><tr><th>Staff</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody data-rows></tbody></table></div></div></section></div></main></div><script src="../js/config.js"></script><script src="../js/utils.js"></script><script src="../js/icons.js"></script><script src="../js/api.js"></script><script src="../js/theme.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script><script src="../js/navigation.js"></script><script src="../js/dashboard.js"></script><script>
JONE.ui.initChrome();JONE.dashboard.boot('admin');document.querySelector('[data-logout]').onclick=()=>Auth.logout();
(function(){var rows=document.querySelector('[data-rows]'),q=document.querySelector('#q'),role=document.querySelector('#role'),active=document.querySelector('#active');function esc(x){return JONE.esc(x||'—')}function load(){JONE.dashboard.DATA.loading(rows);API.list('users',{search:q.value,role:role.value,is_active:active.value,page_size:50}).then(function(r){var a=API.normalizeList(r.data,r.pagination).items||[];if(!a.length)return JONE.dashboard.DATA.empty(rows,'users','No staff found','Create a manager or receptionist account.',5);rows.innerHTML=a.map(function(u){var pic=u.profile_image_url?'<img class="dash-avatar" src="'+esc(u.profile_image_url)+'" alt="" loading="lazy">':'<span class="dash-avatar">'+esc(JONE.initials(u.full_name||u.email))+'</span>';return '<tr><td><div style="display:flex;align-items:center;gap:.6rem">'+pic+'<span>'+esc(u.full_name||u.email)+'<small style="display:block">'+esc(u.email)+'</small></span></div></td><td>'+esc(u.role)+'</td><td>'+JONE.dashboard.statusPill(u.is_active?'ACTIVE':'INACTIVE')+'</td><td>'+esc(u.last_login?JONE.formatDate(u.last_login,'mid'):'Never')+'</td><td><button class="btn btn-sm btn-outline" data-edit="'+u.id+'">Edit</button></td></tr>'}).join('');JONE.icons.inject(rows)}).catch(function(e){JONE.dashboard.DATA.error(rows,'Staff could not be loaded',e.message||'Try again.',5)});}async function openForm(id){var u=id?(await API.getOne('users',id)).data:null;var fields=[{name:'first_name',label:'First name',type:'text',required:true},{name:'last_name',label:'Last name',type:'text',required:true},{name:'email',label:'Email',type:'email',required:true},{name:'phone',label:'Phone',type:'tel'},{name:'role',label:'Role',type:'select',options:[{value:'MANAGER',label:'Manager'},{value:'RECEPTIONIST',label:'Receptionist'}],required:true},{name:'is_active',label:'Active account',type:'checkbox'},{name:'profile_image',label:'Profile image',type:'file',accept:'image/*'}];if(!id)fields.push({name:'password',label:'Temporary password',type:'password',required:true});await JONE.dashboard.formModal({title:id?'Edit staff member':'Create staff member',fields:fields,values:u||{role:'RECEPTIONIST',is_active:true},multipart:true,submitText:id?'Save changes':'Create account',onSubmit:async function(values,formData){if(id)await API.update('users',id,formData);else await API.create('users',formData);load();JONE.ui.toast(id?'Staff account updated.':'Staff account created.','success')}})}document.querySelector('[data-new]').onclick=function(){openForm().catch(function(e){JONE.ui.toast(e.message||'Could not create staff account.','error')})};document.addEventListener('click',function(e){var b=e.target.closest('[data-edit]');if(b)openForm(b.dataset.edit).catch(function(x){JONE.ui.toast(x.message||'Could not load staff account.','error')})});load();[q,role,active].forEach(function(x){x.onchange=load});q.oninput=JONE.debounce(load,300)})();
</script></body></html>
