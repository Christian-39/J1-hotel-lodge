<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Receipt | J-ONE HOTEL & LODGE</title><link rel="stylesheet" href="../css/main.css"><style>.receipt-sheet{max-width:820px;margin:auto;background:#fff;color:#171719;padding:2.5rem;box-shadow:0 8px 30px #0001}.receipt-head{display:flex;justify-content:space-between;gap:1rem;border-bottom:2px solid #b89b5e;padding-bottom:1.25rem;margin-bottom:1.5rem}.receipt-logo{width:74px;height:74px;object-fit:contain}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem 2rem}.receipt-row{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid #eee;padding:.55rem 0}.receipt-total{font-size:1.15rem;font-weight:700;border-top:2px solid #222;margin-top:.75rem}.receipt-actions{max-width:820px;margin:1rem auto;display:flex;gap:.6rem;justify-content:flex-end}@media(max-width:600px){.receipt-sheet{padding:1.1rem}.receipt-head{flex-direction:column}.receipt-grid{grid-template-columns:1fr}}@media print{body{background:#fff!important}.dash-sidebar,.dash-topbar,.receipt-actions{display:none!important}.dash-content{padding:0!important}.receipt-sheet{box-shadow:none;max-width:none;padding:0}}
</style></head><body><div class="dash"><aside class="dash-sidebar"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" width="30"><b class="brand-word">J-ONE</b></div><nav class="dash-sidebar-nav" data-dash-nav></nav></aside><main class="dash-main"><header class="dash-topbar"><h1>Receipt details</h1></header><div class="dash-content"><div class="receipt-actions"><button class="btn btn-accent" data-print>Print / Save PDF</button><button class="btn btn-outline" data-email>Email guest</button></div><article class="receipt-sheet" id="receipt"><div class="receipt-head"><div><img class="receipt-logo" src="../assets/icons/logo-official.svg" alt="J-ONE Hotel & Lodge logo"><h1 data-hotel>J-ONE HOTEL & LODGE</h1><p data-contact></p></div><div><strong>PAYMENT RECEIPT</strong><p>Receipt reference<br><b data-ref>—</b></p></div></div><div class="receipt-grid"><div><strong>Guest</strong><div data-guest></div></div><div><strong>Booking</strong><div data-booking></div></div></div><h3>Stay summary</h3><div class="receipt-grid"><div class="receipt-row"><span>Room</span><b data-room>—</b></div><div class="receipt-row"><span>Dates</span><b data-dates>—</b></div><div class="receipt-row"><span>Nights</span><b data-nights>—</b></div><div class="receipt-row"><span>Payment status</span><b data-status>—</b></div></div><h3>Financial summary</h3><div data-financial></div><p class="caption">Thank you for choosing J-ONE HOTEL & LODGE.</p></article></div></main></div><script src="../js/config.js"></script><script src="../js/utils.js"></script><script src="../js/icons.js"></script><script src="../js/api.js"></script><script src="../js/theme.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script><script src="../js/navigation.js"></script><script src="../js/dashboard.js"></script><script>JONE.ui.initChrome();JONE.dashboard.boot('receptionist');(async function(){var q=new URLSearchParams(location.search),ref=q.get('ref'),r=document.getElementById('receipt');function t(s,x){var e=document.querySelector(s);if(e)e.textContent=x||'—'}function row(a,b,c){return '<div class="receipt-row '+(c||'')+'"><span>'+JONE.esc(a)+'</span><b>'+JONE.esc(b)+'</b></div>'}try{var res=await API.getBookingReceipt(ref),d=res.data||{};t('[data-ref]',d.booking_reference);t('[data-hotel]',d.hotel&&d.hotel.name);t('[data-contact]',[d.hotel&&d.hotel.address,d.hotel&&d.hotel.phone,d.hotel&&d.hotel.email].filter(Boolean).join(' · '));t('[data-guest]',[d.guest&&d.guest.name,d.guest&&d.guest.phone,d.guest&&d.guest.email].filter(Boolean).join(' · '));t('[data-booking]',d.booking_reference);t('[data-room]',(d.room_type||'')+' · '+(d.rooms||1)+' room(s)');t('[data-dates]',JONE.formatDate(d.check_in,'mid')+' → '+JONE.formatDate(d.check_out,'mid'));t('[data-nights]',d.nights);t('[data-status]',d.payment_status);document.querySelector('[data-financial]').innerHTML=row('Room charges',d.subtotal,d.discount?null:null)+row('Discount',d.discount)+row('Taxes',d.tax)+row('Fees',d.fees)+row('Total',d.total,'receipt-total')+row('Amount paid',d.amount_paid)+row('Outstanding balance',d.amount_due);document.querySelector('[data-print]').onclick=()=>window.print();document.querySelector('[data-email]').onclick=async()=>{var b=document.querySelector('[data-email]');if(!JONE.guardSubmit(b))return;try{await API.post('/api/admin/bookings/'+encodeURIComponent(d.booking_reference)+'/send-receipt/',{});JONE.ui.toast('Receipt sent to the guest email.','success')}catch(e){JONE.ui.toast(e.message||'Receipt could not be sent.','error')}finally{JONE.releaseGuard(b)}}}catch(e){r.innerHTML='<div class="empty-state"><h2>Receipt unavailable</h2><p>'+JONE.esc(e.message||'Unable to load this receipt.')+'</p></div>'}})();</script></body></html>
