<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Facilities | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-mark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J&middot;ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Facilities</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Facilities</h2><div class="panel-actions"><button class="btn btn-sm" data-fac-add>Add facility</button></div></div>
  <div class="panel-body">
    <div class="facility-grid" data-facility-grid></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var data=[];
  var grid=document.querySelector("[data-facility-grid]");

  function render(){
    grid.innerHTML=data.map(function(f){
      var id=f.id||f.slug||f.name;
      return '<div class="facility-item" style="flex-direction:column;"><div class="flex-between"><div class="facility-icon"><span data-icon="'+(f.icon||"building")+'" data-size="22"></span></div>'+JONE.dashboard.statusPill(f.status||"active")+'</div><div><h4>'+JONE.esc(f.name||f.title)+'</h4><p>'+JONE.esc(f.description||f.desc||"")+'</p></div><div style="display:flex;gap:0.5rem;"><button class="btn btn-sm btn-outline" data-fac-edit="'+encodeURIComponent(id)+'">Edit</button><button class="btn btn-sm btn-danger" data-fac-del="'+encodeURIComponent(id)+'">Delete</button></div></div>';
    }).join("") || '<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No facilities yet</h3></div>';
    JONE.icons.inject(grid);
  }

  async function load(){
    grid.innerHTML='<div class="loading-block" style="grid-column:1/-1;"><div class="spinner" role="status"></div><p class="muted">Loading facilities&hellip;</p></div>';
    try{
      var res=await window.API.list("facilities");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      data=list||[];
      if(!data.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No facilities yet</h3></div>'; return; }
      render();
    }catch(err){
      grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><span data-icon="alertTriangle" data-size="34"></span><h3>Facilities couldn\'t be loaded</h3><p>'+((err&&err.status===0&&err.message)||"Please try again in a moment.")+'</p></div>';
      JONE.icons.inject(grid);
    }
  }
  load();

  document.addEventListener("click",function(e){
    var del=e.target.closest("[data-fac-del]");
    if(del){
      var id=decodeURIComponent(del.getAttribute("data-fac-del"));
      JONE.ui.confirm({title:"Remove this facility?",message:"The facility will be removed from the site.",confirmText:"Delete",danger:true}).then(async function(ok){
        if(!ok) return;
        try{
          await window.API.remove("facilities", id);
          JONE.ui.toast("Facility removed.","success");
          load();
        }catch(err){ JONE.ui.toast("Couldn't remove this facility. Please try again.","error"); }
      });
    }
    var edit=e.target.closest("[data-fac-edit]");
    if(edit){ location.href="facilities.html?edit="+encodeURIComponent(decodeURIComponent(edit.getAttribute("data-fac-edit"))); }
  });
  var add=document.querySelector("[data-fac-add]");
  if(add) add.addEventListener("click",function(){ location.href="facilities.html?new=1"; });
})();

</script>
</body>
</html>
