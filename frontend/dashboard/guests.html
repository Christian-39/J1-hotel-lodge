<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guests | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-mark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J&middot;ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Guests</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="g-q">Search</label><input class="input" id="g-q" placeholder="Name, phone, email"></div>
    <div class="filter-actions"><button class="btn btn-sm" data-new-guest>Add guest</button></div>
  </div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Guest</th><th class="hide-sm">Contact</th><th class="hide-sm">Stays</th><th>Last stay</th><th></th></tr></thead>
      <tbody data-tbody="guests"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA = JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=guests]");
  var guests=[];

  function name(g){ return g.full_name || g.name || (g.user && g.user.full_name) || "—"; }
  function contact(g){ return g.phone || g.phone_number || g.email || ""; }
  function stays(g){ return g.stay_count != null ? g.stay_count : g.stays; }
  function last(g){ return g.last_checkin || g.last_stay || g.last_visit || null; }

  function render(list){
    if(!list.length){ tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><span data-icon="users"></span><h3>No guests found</h3></div></td></tr>'; JONE.icons.inject(tbody); return; }
    tbody.innerHTML=list.map(function(g){
      var nm = name(g);
      return '<tr><td><strong>'+JONE.esc(nm)+'</strong></td><td class="hide-sm">'+JONE.esc(contact(g))+'</td><td class="hide-sm">'+(stays(g)||0)+'</td><td>'+JONE.formatDate(last(g),"mid")+'</td><td><a class="btn btn-sm btn-outline" href="bookings.html">History</a></td></tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  var q=document.getElementById("g-q");
  function apply(){
    var needle=(q&&q.value||"").toLowerCase();
    render(guests.filter(function(g){
      return !needle || name(g).toLowerCase().indexOf(needle)>-1 || (contact(g)||"").toLowerCase().indexOf(needle)>-1;
    }));
  }
  if(q) q.addEventListener("input", JONE.debounce(apply,200));

  async function load(){
    DATA.loading(tbody);
    try{
      var res = await window.API.list("guests");
      var list = window.API.normalizeList ? window.API.normalizeList(res.data).items : ((res.data && res.data.results) || res.data || []);
      guests = list || [];
      if(!guests.length){ DATA.empty(tbody, "users", "No guests yet", "Guest profiles will appear here after bookings.", 5); return; }
      apply();
    }catch(err){
      DATA.error(tbody, "Guests couldn't be loaded", "Please try again in a moment.", 5);
    }
  }
  load();

  var add=document.querySelector("[data-new-guest]");
  if(add) add.addEventListener("click", function(){ location.href="guests.html?new=1"; });
})();

</script>
</body>
</html>
