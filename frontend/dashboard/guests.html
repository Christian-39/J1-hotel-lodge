<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Guests | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Guests</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="g-q">Search</label><input class="input" id="g-q" placeholder="Name, phone, email"></div>
    <div class="filter-actions"><a class="btn btn-sm btn-outline" href="bookings.html" title="Create a booking — the guest profile is created with it"><span data-icon="plus" data-size="14"></span> New booking</a></div>
  </div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Guest</th><th class="hide-sm">Contact</th><th class="hide-sm">Stays</th><th>Last stay</th><th></th></tr></thead>
      <tbody data-tbody="guests"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/hotel-data.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA = JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=guests]");

  /* Verified /api/admin/guests/ row:
     { id, first_name, last_name, full_name, email, phone, city, state,
       country, bookings_count, last_booking_at, created_at } — ?search= supported. */
  function render(list){
    if(!list.length){ tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><span data-icon="users"></span><h3>No guests found</h3><p>Guest profiles appear after their first booking.</p></div></td></tr>'; JONE.icons.inject(tbody); return; }
    tbody.innerHTML=list.map(function(g){
      var nm = g.full_name || [g.first_name,g.last_name].filter(Boolean).join(" ") || g.email || "—";
      var loc=[g.city,g.state,g.country].filter(Boolean).join(", ");
      return '<tr><td><strong>'+JONE.esc(nm)+'</strong><div class="caption">'+JONE.esc(g.email||"")+'</div></td><td class="hide-sm">'+JONE.esc(g.phone||"—")+'<div class="caption">'+JONE.esc(loc||"")+'</div></td><td class="hide-sm num">'+(g.bookings_count!=null?g.bookings_count:0)+'</td><td>'+JONE.esc(g.last_booking_at?JONE.formatDate(g.last_booking_at,"mid"):"—")+'</td><td style="white-space:nowrap;"><div class="row-actions"><button class="btn btn-sm btn-outline" type="button" data-guest-open="'+g.id+'"><span data-icon="eye" data-size="13"></span> Profile</button> <button class="btn btn-sm btn-ghost" type="button" data-guest-edit="'+g.id+'" title="Edit"><span data-icon="edit" data-size="13"></span></button> <a class="btn btn-sm btn-ghost" href="bookings.html?search='+encodeURIComponent(nm)+'" title="Booking history"><span data-icon="search" data-size="13"></span></a></div></td></tr>';
    }).join("");
    bindGuestRows();
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var params = { page_size: 50 };
      var q = document.getElementById("g-q");
      if (q && q.value.trim()) params.search = q.value.trim();
      var res = await window.API.list("guests", params);
      var list = window.API.normalizeList(res.data, res.pagination).items;
      if(!(list||[]).length){ DATA.empty(tbody, "users", "No guests yet", "Guest profiles will appear here after bookings.", 5); return; }
      render(list);
    }catch(err){
      DATA.error(tbody, "Guests couldn't be loaded", (err && err.message) || "Please try again in a moment.", 5);
    }
  }
  load();

  var q=document.getElementById("g-q");
  if(q) q.addEventListener("input", JONE.debounce(load,300));

  /* -------- Guest profile ------------------------------------------------
     VIEW uses the shared, complete profile card (all stored fields + the
     full booking/stay history with room numbers and money).
     EDIT reuses formModal so validation and backend field errors behave
     like everywhere else in the console.

     Verified: GET /api/admin/guests/{id}/ adds address, identification_type,
     identification_number, special_requests, bookings[] (last 15, each with
     room_numbers), user_id — sensitive ID numbers are masked by the backend
     for receptionists. PATCH /{id}/ (AdminGuestUpdateSerializer): first_name,
     last_name, email, phone, address, city, state, country,
     identification_type, identification_number, special_requests. */
  var ID_TYPES = ["", "PASSPORT", "DRIVERS_LICENSE", "NATIONAL_ID", "VOTERS_CARD"];

  function bindGuestRows(){
    tbody.querySelectorAll("[data-guest-open]").forEach(function(b){
      b.addEventListener("click", function(){
        JONE.dashboard.guestProfileModal(b.getAttribute("data-guest-open"));
      });
    });
    tbody.querySelectorAll("[data-guest-edit]").forEach(function(b){
      b.addEventListener("click", function(){ editGuest(b.getAttribute("data-guest-edit")); });
    });
  }

  async function editGuest(id){
    var g;
    try {
      var res = await window.API.getOne("guests", id);
      g = res.data;
    } catch (err) {
      JONE.ui.toast((err && err.message) || "Couldn't load the guest profile.", "error");
      return;
    }
    var saved = await JONE.dashboard.formModal({
      title: "Edit guest — " + (g.full_name || g.email),
      submitText: "Save changes",
      wide: true,
      values: g,
      fields: [
        { name:"first_name", label:"First name", required:true },
        { name:"last_name", label:"Last name", required:true },
        { name:"email", label:"Email", type:"email", required:true },
        { name:"phone", label:"Phone", required:true },
        { name:"address", label:"Address" },
        { name:"city", label:"City" },
        { name:"state", label:"State" },
        { name:"country", label:"Country" },
        { name:"identification_type", label:"ID type", type:"select",
          options:ID_TYPES.map(function(t){ return { value:t, label:t?t.replace(/_/g," "):"—" }; }) },
        { name:"identification_number", label:"ID number" },
        { name:"special_requests", label:"Special requests / notes", type:"textarea", rows:2 }
      ],
      onSubmit: function(v){
        Object.keys(v).forEach(function(k){ if(v[k]==="") delete v[k]; });
        return window.API.update("guests", g.id, v).then(function(){
          JONE.ui.toast("Guest profile saved.", "success");
        });
      }
    });
    if (saved) load();
  }

  /* Note: the backend intentionally exposes guests as list/detail/update only.
     Guest profiles are created through bookings — see the "New booking" action
     on the bookings page. No fake "add guest" is offered here. */
})();
</script>
</body>
</html>
