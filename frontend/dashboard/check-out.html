<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Check-out | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Check-out</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Today's departures</h2></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Reference</th><th>Guest</th><th class="hide-sm">Room</th><th>Total</th><th class="hide-sm">Paid</th><th>Balance</th><th></th></tr></thead>
      <tbody data-tbody="checkout"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/hotel-data.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=checkout]");
  var departures=[];

  /* Verified /api/admin/bookings/ rows. In-house guests to check out today:
     status=CHECKED_IN (optionally check_out=today). The check-out action is
     POST /api/admin/bookings/{ref}/check-out/ and may require
     { allow_balance_due: true } when a balance remains. */
  function refOf(b){ return b.booking_reference || b.id; }
  function roomLabel(b){ return (b.room_numbers && b.room_numbers.length) ? b.room_numbers.join(", ") : (b.room_type_name || "—"); }

  function render(list){
    tbody.innerHTML=list.map(function(b){
      var ref=refOf(b);
      var due=Number(b.amount_due||0);
      return '<tr><td>'+JONE.esc(ref)+'</td><td>'+JONE.esc(b.guest_name||"—")+'</td><td class="hide-sm">'+JONE.esc(roomLabel(b))+'</td><td class="num">'+JONE.esc(JONE.formatNaira(b.total_amount))+'</td><td class="hide-sm num">'+JONE.esc(JONE.formatNaira(b.amount_paid))+'</td><td class="num '+(due>0?"text-danger":"text-success")+'">'+JONE.esc(JONE.formatNaira(due))+'</td><td><button class="btn btn-sm btn-accent" data-checkout-btn="'+encodeURIComponent(ref)+'"'+(due>0?' data-due="1"':'')+'>Check out</button></td></tr>';
    }).join("") || '<tr><td colspan="7"><div class="empty-state"><span data-icon="logOut"></span><h3>No guests in-house</h3></div></td></tr>';
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var res=await window.API.list("bookings",{ status:"CHECKED_IN", ordering:"check_out", page_size:50 });
      var list=window.API.normalizeList?window.API.normalizeList(res.data,res.pagination).items:((res.data&&res.data.results)||res.data||[]);
      departures=list||[];
      if(!departures.length){ DATA.empty(tbody,"logOut","No guests in-house","Checked-in guests appear here until they check out.",7); return; }
      render(departures);
    }catch(err){ DATA.error(tbody,"Departures couldn't be loaded",(err&&err.message)||"Please try again in a moment.",7); }
  }
  load();

  document.addEventListener("click", async function(e){
    var btn=e.target.closest("[data-checkout-btn]");
    if(!btn) return;
    var ref=decodeURIComponent(btn.getAttribute("data-checkout-btn"));
    var hasDue=btn.getAttribute("data-due")==="1";
    if(hasDue && !window.confirm("This booking still has an unpaid balance. Check out anyway?")) return;
    if(!JONE.guardSubmit(btn)) return;
    try{
      btn.disabled=true;
      await window.API.checkOutBooking(ref, hasDue ? { allow_balance_due: true } : {});
      JONE.ui.toast("Guest checked out ("+ref+").","success");
      load();
    }catch(err){
      JONE.releaseGuard(btn);
      btn.disabled=false;
      JONE.ui.toast(err && (err.message || "Couldn't check out this guest. Please try again."),"error");
    }
  });
})();

</script>
</body>
</html>
