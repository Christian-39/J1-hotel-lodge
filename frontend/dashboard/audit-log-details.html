<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log Detail | J-ONE</title><link rel="stylesheet" href="../css/main.css"></head><body><div class="dash"><aside class="dash-sidebar"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" width="30"><b class="brand-word">J-ONE</b></div><nav class="dash-sidebar-nav" data-dash-nav></nav><div class="dash-sidebar-footer"><div data-dash-user></div></div></aside><main class="dash-main"><header class="dash-topbar"><div class="dash-topbar-left"><button class="btn-icon btn-outline dash-menu-toggle" data-icon="menu" aria-label="Open menu"></button><div class="dash-title"><h1>Audit log detail</h1></div></div></header><div class="dash-content"><section class="panel"><div class="panel-head"><h2 data-title>Audit event</h2><a class="btn btn-sm btn-outline" href="audit-logs.html">Back to audit logs</a></div><div class="panel-body" data-detail><div class="loading-block"><div class="spinner"></div><p>Loading audit event…</p></div></div></section></div></main></div><script src="../js/config.js"></script><script src="../js/utils.js"></script><script src="../js/icons.js"></script><script src="../js/api.js"></script><script src="../js/theme.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script><script src="../js/navigation.js"></script><script src="../js/dashboard.js"></script><script>JONE.ui.initChrome();JONE.dashboard.boot('admin');(async function(){var el=document.querySelector('[data-detail]'),id=new URLSearchParams(location.search).get('id');if(!id){el.innerHTML='<div class="empty-state"><h3>Audit event not found</h3></div>';return}try{var r=await API.getOne('auditLogs',id),a=r.data||{};document.querySelector('[data-title]').textContent=a.action||'Audit event';var rows=[['Event',a.action],['Time',a.created_at&&JONE.formatDateTime(a.created_at)],['Actor',a.actor_name||a.actor_email||'System'],['Actor email',a.actor_email],['Object',((a.object_type||'')+' '+(a.object_id||'')).trim()],['IP address',a.ip_address],['Summary',a.summary]];function block(label,value){return '<div class="field"><div class="field-label">'+JONE.esc(label)+'</div><div>'+JONE.esc(value||'—')+'</div></div>'}el.innerHTML=rows.map(function(x){return block(x[0],x[1])}).join('')+'<div class="form-grid fg-2"><div><h3>Changes</h3><pre style="white-space:pre-wrap;overflow:auto">'+JONE.esc(JSON.stringify(a.changes||{},null,2))+'</pre></div><div><h3>Metadata</h3><pre style="white-space:pre-wrap;overflow:auto">'+JONE.esc(JSON.stringify(a.metadata||{},null,2))+'</pre></div></div>'}catch(e){el.innerHTML='<div class="empty-state"><h3>Audit event could not be loaded</h3><p>'+JONE.esc(e.message||'Please try again.')+'</p></div>}})();</script></body></html>
