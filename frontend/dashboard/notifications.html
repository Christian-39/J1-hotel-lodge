<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Notifications | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-dark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Notifications</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Notifications</h2><div class="panel-actions"><button class="btn btn-sm btn-outline" data-notif-all>Mark all read</button></div></div>
  <div class="notif-list" data-notif-list></div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var list=document.querySelector("[data-notif-list]");
  var notifs=[];

  function icon(n){ return n.icon || "bell"; }
  function title(n){ return n.title || n.message || ""; }
  function msg(n){ return n.body || n.message || n.description || ""; }
  function time(n){ return n.created_at || n.time_label || n.time || ""; }
  function unread(n){ return n.read===false || n.is_read===false || n.unread===true; }

  function render(){
    var unreadN=notifs.filter(unread).length;
    var unreadEl=document.querySelector("[data-notif-unread]");
    if(unreadEl) unreadEl.textContent = unreadN;
    list.innerHTML=notifs.map(function(n){
      return '<div class="notif-item'+(unread(n)?" unread":"")+'"><span class="notif-icon"><span data-icon="'+JONE.esc(icon(n))+'" data-size="18"></span></span><div class="notif-body"><p class="notif-title">'+JONE.esc(title(n))+'</p><p>'+JONE.esc(msg(n))+'</p><div class="notif-meta">'+JONE.esc(time(n))+'</div></div></div>';
    }).join("") || '<div class="empty-state" style="margin:1.5rem;"><span data-icon="bell"></span><h3>You are all caught up</h3></div>';
    JONE.icons.inject(list);
  }

  async function load(){
    DATA.loading(list, "list");
    try{
      var res=await window.API.list("notifications");
      var listData=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      notifs=listData||[];
      if(!notifs.length){ DATA.empty(list,"bell","You are all caught up","No notifications right now.",1); return; }
      render();
    }catch(err){ DATA.error(list,"Notifications couldn't be loaded","Please try again in a moment.",1); }
  }
  load();

  var markAll=document.querySelector("[data-notif-all]");
  if(markAll) markAll.addEventListener("click", function(){
    var ids=notifs.filter(unread).map(function(n){return n.id;});
    JONE.ui.toast("Marking notifications as read…","info");
    (async function(){
      try{
        // Only show success after the backend confirms all were updated.
        await Promise.all(ids.map(function(id){return window.API.update("notifications", id, { read:true });}));
        notifs.forEach(function(n){ if("read" in n) n.read=true; if("is_read" in n) n.is_read=true; n.unread=false; });
        render();
        JONE.ui.toast("All notifications marked as read.","success");
      }catch(err){
        JONE.ui.toast("Couldn't update notifications. Please try again.","error");
      }
    })();
  });
})();

</script>
</body>
</html>
