<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Notifications | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Notifications</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Notifications</h2><div class="panel-actions"><button class="btn btn-sm btn-outline" data-notif-all>Mark all read</button></div></div>
  <div class="notif-list" data-notif-list></div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/hotel-data.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var list=document.querySelector("[data-notif-list]");

  /* Verified /api/notifications/ shape:
     { unread_count, notifications: [ { id, type, title, message, link,
       is_read, created_at } ] }
     Actions: POST /read-all/ · POST /{id}/read/ → { unread_count } */
  function icon(n){
    var t=String(n.type||"");
    if(t.indexOf("PAYMENT")===0) return "wallet";
    if(t==="CHECK_IN"||t==="CHECK_OUT") return "logOut";
    if(t.indexOf("BOOKING")===0) return "calendar";
    if(t==="ENQUIRY_NEW") return "inbox";
    return "bell";
  }
  function unread(n){ return n.is_read===false; }

  function render(notifs, unreadCount){
    var unreadEl=document.querySelector("[data-notif-unread]");
    if(unreadEl) unreadEl.textContent = unreadCount!=null?unreadCount:notifs.filter(unread).length;
    list.innerHTML=notifs.map(function(n){
      return '<div class="notif-item'+(unread(n)?" unread":"")+'" data-notif-id="'+JONE.esc(n.id)+'"><span class="notif-icon"><span data-icon="'+icon(n)+'" data-size="18"></span></span><div class="notif-body"><p class="notif-title">'+JONE.esc(n.title||"")+'</p><p>'+JONE.esc(n.message||"")+'</p><div class="notif-meta">'+JONE.esc(n.created_at?JONE.formatDateTime(n.created_at):"")+'</div></div></div>';
    }).join("") || '<div class="empty-state" style="margin:1.5rem;"><span data-icon="bell"></span><h3>You are all caught up</h3></div>';
    JONE.icons.inject(list);
  }

  async function load(){
    DATA.loading(list, "list");
    try{
      var res=await window.API.getNotifications({ page_size:50 });
      var d=(res&&res.data)||{};
      var notifs=d.notifications||[];
      if(!notifs.length){ DATA.empty(list,"bell","You are all caught up","No notifications right now.",1); 
        var unreadEl=document.querySelector("[data-notif-unread]"); if(unreadEl) unreadEl.textContent=d.unread_count||0;
        return; }
      render(notifs, d.unread_count);
    }catch(err){ DATA.error(list,"Notifications couldn't be loaded",(err&&err.message)||"Please try again in a moment.",1); }
  }
  load();

  // Mark all read — one real POST; success only after the backend confirms.
  var markAll=document.querySelector("[data-notif-all]");
  if(markAll) markAll.addEventListener("click", async function(){
    if(!JONE.guardSubmit(markAll)) return;
    try{
      var res=await window.API.markAllNotificationsRead();
      JONE.ui.toast("All notifications marked as read.","success");
      load();
    }catch(err){
      JONE.releaseGuard(markAll);
      JONE.ui.toast(err.message||"Couldn't update notifications.","error");
    }
  });

  // Click an unread item -> mark that one read (backend-confirmed).
  list.addEventListener("click", async function(e){
    var item=e.target.closest("[data-notif-id]");
    if(!item||!item.classList.contains("unread")) return;
    var id=item.getAttribute("data-notif-id");
    try{
      await window.API.markNotificationRead(id);
      item.classList.remove("unread");
      var unreadEl=document.querySelector("[data-notif-unread]");
      if(unreadEl){ var v=Number(unreadEl.textContent||0); if(v>0) unreadEl.textContent=v-1; }
    }catch(_){ /* keep unread; next load refreshes honestly */ }
  });
})();

</script>
</body>
</html>
