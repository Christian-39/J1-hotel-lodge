<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gallery | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-mark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J&middot;ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Gallery</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Gallery &amp; media</h2><div class="panel-actions"><button class="btn btn-sm" data-gal-upload>Upload media</button></div></div>
  <div class="panel-body">
    <div class="gallery-grid" data-gallery-grid></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var items=[];
  var grid=document.querySelector("[data-gallery-grid]");

  function url(g){ return g.image_url || g.image || g.file_url || g.src || ""; }
  function caption(g){ return g.caption || g.title || "J-ONE Hotel & Lodge"; }
  function category(g){ return g.category || g.type || ""; }
  function status(g){ return g.status || (g.is_active===false?"inactive":"active"); }

  function render(){
    grid.innerHTML=items.map(function(g){
      var id=g.id||g.slug||g.title||url(g);
      var img=url(g)?'<img src="'+JONE.esc(url(g))+'" alt="'+JONE.esc(caption(g))+'">':'<div class="placeholder-placeholder"><span data-icon="image"></span></div>';
      return '<div class="media wide" style="position:relative;"><div class="media" style="position:absolute;inset:0;aspect-ratio:auto;">'+img+'</div><div class="media-actions" style="position:absolute;top:0.5rem;right:0.5rem;z-index:2;display:flex;gap:0.4rem;"><button class="btn-icon btn-sm btn-outline" style="background:var(--color-surface);" data-gal-edit="'+encodeURIComponent(id)+'" aria-label="Edit"><span data-icon="edit" data-size="16"></span></button><button class="btn-icon btn-sm btn-danger" data-gal-del="'+encodeURIComponent(id)+'" aria-label="Delete"><span data-icon="trash" data-size="16"></span></button></div>'+(status(g)==="inactive"?'<span class="badge" style="position:absolute;bottom:0.5rem;left:0.5rem;z-index:2;">Inactive</span>':'')+'</div>';
    }).join("") || '<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No gallery images yet</h3></div>';
    JONE.icons.inject(grid);
  }

  async function load(){
    grid.innerHTML='<div class="loading-block" style="grid-column:1/-1;"><div class="spinner" role="status"></div><p class="muted">Loading gallery&hellip;</p></div>';
    try{
      var res=await window.API.list("gallery");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      items=list||[];
      if(!items.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No gallery images yet</h3></div>'; return; }
      render();
    }catch(err){
      grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><span data-icon="alertTriangle" data-size="34"></span><h3>Gallery couldn\'t be loaded</h3><p>'+((err&&err.status===0&&err.message)||"Please try again in a moment.")+'</p></div>';
      JONE.icons.inject(grid);
    }
  }
  load();

  document.addEventListener("click",function(e){
    var del=e.target.closest("[data-gal-del]");
    if(del){
      var id=decodeURIComponent(del.getAttribute("data-gal-del"));
      JONE.ui.confirm({title:"Delete this image?",message:"This will remove the media from the gallery.",danger:true}).then(async function(ok){
        if(!ok) return;
        try{ await window.API.remove("gallery", id); JONE.ui.toast("Image deleted.","success"); load(); }
        catch(err){ JONE.ui.toast("Couldn't delete this image. Please try again.","error"); }
      });
    }
  });
  var up=document.querySelector("[data-gal-upload]");
  if(up) up.addEventListener("click",function(){ location.href="gallery.html?new=1"; });
})();

</script>
</body>
</html>
