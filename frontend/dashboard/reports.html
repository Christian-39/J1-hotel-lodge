<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reports | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-mark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J&middot;ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Reports</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <label class="field-label" style="align-self:center;">Period:</label>
    <div class="field"><select class="select" id="rp-range"><option>Today</option><option>Yesterday</option><option>This week</option><option selected>This month</option><option>Custom</option></select></div>
    <div class="field"><label class="field-label" for="rp-from">From</label><input class="input" type="date" id="rp-from"></div>
    <div class="field"><label class="field-label" for="rp-to">To</label><input class="input" type="date" id="rp-to"></div>
  </div>
  <div class="panel-body">
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Revenue</div><div class="kpi-value">₦1.28m</div><div class="kpi-sub"><span class="up">▲ 12%</span> vs last month</div></div>
      <div class="kpi"><div class="kpi-label">Bookings</div><div class="kpi-value">46</div><div class="kpi-sub">38 online · 8 manual</div></div>
      <div class="kpi"><div class="kpi-label">Occupancy</div><div class="kpi-value">78%</div><div class="kpi-sub">available 4 · occupied 12</div></div>
      <div class="kpi"><div class="kpi-label">Outstanding</div><div class="kpi-value">₦96,500</div><div class="kpi-sub">3 partial payments</div></div>
    </div>

    <div class="panel-grid" style="margin-top:1.5rem;">
      <section class="panel" style="border:1px solid var(--color-border);">
        <div class="panel-head"><h3>Revenue by method</h3></div>
        <div class="panel-body no-pad"><div class="table-wrap"><table class="table">
          <thead><tr><th>Method</th><th>Amount</th><th class="hide-sm">Share</th></tr></thead>
          <tbody data-tbody="report-methods"></tbody>
        </table></div></div>
      </section>
      <section class="panel" style="border:1px solid var(--color-border);">
        <div class="panel-head"><h3>Bookings summary</h3></div>
        <div class="panel-body no-pad"><div class="table-wrap"><table class="table">
          <thead><tr><th>Metric</th><th>Count</th></tr></thead>
          <tbody data-tbody="report-bookings"></tbody>
        </table></div></div>
      </section>
    </div>
    <div style="margin-top:1.5rem;display:flex;gap:0.75rem;">
      <button class="btn btn-sm btn-outline" id="export-csv" type="button"><span data-icon="download" data-size="16"></span> Export CSV</button>
    </div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var mt=document.querySelector("[data-tbody=report-methods]");
  var bt=document.querySelector("[data-tbody=report-bookings]");

  function renderReport(r){
    if(!r) return;
    // Payment methods breakdown — backend values only.
    if(mt){
      var methods=(r.payment_methods||r.payments_by_method||r.methods||[]);
      mt.innerHTML = methods.length ? methods.map(function(x){
        return '<tr><td>'+JONE.esc(x.method||x.m||x.name)+'</td><td class="num">'+JONE.formatNaira(x.amount||x.total||x.a||0)+'</td><td class="hide-sm">'+(x.share||x.percentage||x.s||"")+'</td></tr>';
      }).join("") : '<tr><td colspan="3"><div class="empty-state"><h3>No payment data</h3></div></td></tr>';
    }
    // Booking summary metrics — backend values only.
    if(bt){
      var bookings=(r.booking_metrics||r.bookings||[]);
      bt.innerHTML = bookings.length ? bookings.map(function(x){
        return '<tr><td>'+JONE.esc(x.label||x.metric||x[0])+'</td><td class="num">'+JONE.esc(x.count!=null?x.count:x.value)+'</td></tr>';
      }).join("") : '<tr><td colspan="2"><div class="empty-state"><h3>No report data</h3></div></td></tr>';
    }
  }

  async function load(){
    if(mt){ DATA.loading(mt); }
    try{
      var res=await window.API.list("reports");
      renderReport(res.data);
    }catch(err){ if(mt){ DATA.error(mt,"Report couldn't be loaded","Please try again in a moment.",3,true);} }
  }
  load();

  // Export is a backend action; success only on server confirmation.
  var exportBtn=document.getElementById("export-csv");
  if(exportBtn) exportBtn.addEventListener("click", async function(){
    if(!JONE.guardSubmit(exportBtn)) return;
    try{
      exportBtn.disabled=true;
      var res=await window.API.list("reports", { format:"csv", _export:true });
      var url=(res.data&&(res.data.url||res.data.file_url||res.data.download_url));
      if(url){ window.location.href=url; JONE.ui.toast("Export ready to download.","success"); }
      else { JONE.ui.toast("Export generated.","success"); }
    }catch(err){
      exportBtn.disabled=false; JONE.releaseGuard(exportBtn);
      JONE.ui.toast(err&&err.status===0?err.message:"Couldn't export the report. Please try again.","error");
    }
  });
})();

</script>
</body>
</html>
