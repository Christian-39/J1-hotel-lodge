<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Availability | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-dark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Availability</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head">
    <h2>Room availability</h2>
    <div class="panel-actions">
      <button class="btn btn-sm btn-outline" data-av-prev>‹ Prev</button>
      <input class="input" type="date" id="av-from" style="width:150px;padding:0.5em 0.8em;font-size:var(--fs-sm);">
      <button class="btn btn-sm btn-outline" data-av-next>Next ›</button>
    </div>
  </div>
  <div class="panel-body no-pad">
    <div class="avo-legend">
      <span><i style="background:var(--color-success-bg);border:1px solid var(--color-border);"></i> Available</span>
      <span><i style="background:var(--color-warning-bg);border:1px solid var(--color-border);"></i> Reserved</span>
      <span><i style="background:var(--color-info-bg);border:1px solid var(--color-border);"></i> Occupied</span>
      <span><i style="background:var(--color-danger-bg);border:1px solid var(--color-border);"></i> Maintenance</span>
    </div>
    <div class="avo-scroller"><table class="avo-table" data-avo></table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var state={from:JONE.todayISO(0)};
  var table=document.querySelector("[data-avo]");
  var rooms=[];        // real rooms from the staff endpoint
  var avail=[];        // real availability entries from the staff endpoint

  function roomLabel(r){ return r.number || r.name || r.label || r.id || "Room"; }
  function roomType(r){ return r.type || r.category || ""; }

  function cellStatus(roomKey, dateISO){
    // Backend-provided status only. No synthetic pattern here.
    var hit=avail.find && avail.find(function(a){
      var aKey=(a.room && (a.room.number || a.room.id)) || a.room_number || a.room_id;
      var aDate=a.date || a.check_in || null;
      return String(aKey)===String(roomKey) && aDate===dateISO;
    });
    return hit ? (hit.status || "free") : "";
  }

  function render(){
    if(!table) return;
    var cols=7;
    var rowName=rooms.map(function(r){
      return '<th style="text-align:left;min-width:70px;">'+JONE.esc(roomLabel(r))+' <span style="color:var(--color-text-faint);font-weight:400;">'+JONE.esc(roomType(r))+'</span></th>';
    }).join("");
    var header='<tr><th style="text-align:left;min-width:130px;">Room</th>'+rowName+'</tr>';
    var body="";
    for(var d=0;d<cols;d++){
      var dt=new Date(state.from); dt.setDate(dt.getDate()+d);
      var dateISO=dt.toISOString().slice(0,10);
      var wd=dt.toLocaleDateString("en-GB",{weekday:"short"});
      var num=dt.getDate();
      body+='<tr><th style="text-align:left;color:var(--color-text-muted);">'+wd+' '+num+'</th>';
      body+=rooms.map(function(r){
        var key=(r.number || r.id);
        var st=cellStatus(key, dateISO) || "free";
        return '<td><span class="avo-cell '+JONE.esc(st)+'" title="'+JONE.esc(st)+'"></span></td>';
      }).join("");
      body+='</tr>';
    }
    table.innerHTML=header+body;
  }

  function showError(msg){
    if(!table) return;
    table.innerHTML='<tr><td><div class="empty-state" style="padding:2rem;text-align:left;"><span data-icon="alertTriangle" data-size="34"></span><h3>Availability couldn\'t be loaded</h3><p>'+(msg||"Please try again in a moment.")+'</p></div></td></tr>';
    JONE.icons.inject(table);
  }

  async function load(){
    if(!table) return;
    table.innerHTML='<tr><td><div class="loading-block"><div class="spinner" role="status"></div><p class="muted">Loading availability&hellip;</p></div></td></tr>';
    try{
      var rr=await window.API.list("rooms");
      var rl=window.API.normalizeList?window.API.normalizeList(rr.data).items:((rr.data&&rr.data.results)||rr.data||[]);
      rooms=rl||[];
      if(!rooms.length){ showError("No rooms are configured in the system yet."); return; }
      var ar=await window.API.list("availability",{ from:state.from, days:7 });
      var al=window.API.normalizeList?window.API.normalizeList(ar.data).items:((ar.data&&ar.data.results)||ar.data||[]);
      avail=al||[];
      render();
    }catch(err){
      showError(err && err.message && err.status===0 ? err.message : "");
    }
  }

  var inp=document.getElementById("av-from");
  if(inp) inp.value=state.from;
  if(inp) inp.addEventListener("change",function(){state.from=inp.value;load();});
  var prev=document.querySelector("[data-av-prev]");
  if(prev) prev.addEventListener("click",function(){var d=new Date(state.from);d.setDate(d.getDate()-7);state.from=d.toISOString().slice(0,10);if(inp)inp.value=state.from;load();});
  var next=document.querySelector("[data-av-next]");
  if(next) next.addEventListener("click",function(){var d=new Date(state.from);d.setDate(d.getDate()+7);state.from=d.toISOString().slice(0,10);if(inp)inp.value=state.from;load();});

  load();
})();

</script>
</body>
</html>
