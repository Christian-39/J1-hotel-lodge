<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Audit Logs | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Audit Logs</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Audit log</h2><div class="panel-actions"><label class="sr-only" for="al-filter">Filter by action</label><select class="select" id="al-filter" style="min-width:180px;font-size:var(--fs-sm);padding:0.5em 0.8em;"><option value="">All actions</option><option value="BOOKING_CREATED">Booking created</option><option value="BOOKING_CONFIRMED">Booking confirmed</option><option value="BOOKING_MODIFIED">Booking modified</option><option value="BOOKING_CANCELLED">Booking cancelled</option><option value="BOOKING_EXPIRED">Booking expired</option><option value="NO_SHOW">No-show</option><option value="CHECK_IN">Check-in</option><option value="CHECK_OUT">Check-out</option><option value="AUTO_CHECK_OUT">Automatic check-out</option><option value="ROOM_ASSIGNED">Room assigned</option><option value="PAYMENT_INITIALIZED">Payment initialized</option><option value="PAYMENT_RECORDED">Payment recorded</option><option value="PAYMENT_VERIFIED">Payment verified</option><option value="PAYMENT_REFUNDED">Payment refunded</option><option value="SETTINGS_CHANGED">Settings changed</option><option value="USER_CREATED">User created</option><option value="USER_UPDATED">User updated</option><option value="USER_ROLE_CHANGED">User role changed</option></select></div></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th class="hide-sm">Detail</th><th class="hide-sm">IP</th><th><span class="sr-only">Open</span></th></tr></thead>
      <tbody data-tbody="audit"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/hotel-data.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("admin");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=audit]");

  /* Verified /api/admin/audit-logs/ row: { id, actor_email, actor_name,
     action, object_type, object_id, summary, changes, metadata,
     ip_address, created_at } — filters: action, object_type, actor,
     date_from, date_to (server-side). */
  function user(e){ return e.actor_name || e.actor_email || "System"; }

  function render(list){
    tbody.innerHTML=list.map(function(e){
      var href='audit-log-details.html?id='+encodeURIComponent(e.id);
      return '<tr>'+
        '<td class="caption">'+JONE.formatDateTime(e.created_at)+'</td>'+
        '<td>'+JONE.esc(user(e))+'</td>'+
        '<td><span class="badge">'+JONE.esc(String(e.action||"").replace(/_/g," "))+'</span></td>'+
        '<td class="hide-sm"><a href="'+href+'">'+JONE.esc(e.summary||'View details')+'</a></td>'+
        '<td class="hide-sm caption">'+JONE.esc(e.ip_address||"")+'</td>'+
        // Always-visible action so the detail can be opened on phones too.
        '<td><a class="btn btn-sm btn-outline" href="'+href+'" aria-label="View audit event '+JONE.esc(e.id)+'"><span data-icon="eye" data-size="14"></span><span class="hide-sm"> View</span></a></td>'+
      '</tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var params={ page_size:50 };
      var al=document.getElementById("al-filter");
      if(al&&al.value) params.action=al.value;
      var res=await window.API.list("auditLogs",params);
      var list=window.API.normalizeList(res.data,res.pagination).items||[];
      if(!list.length){ DATA.empty(tbody,"fileText","No audit entries yet","Actions performed by staff will be recorded here.",6); return; }
      render(list);
    }catch(err){ DATA.error(tbody,"Audit log couldn't be loaded",(err&&err.message)||"Please try again in a moment.",6); }
  }
  load();

  var al=document.getElementById("al-filter");
  if(al) al.addEventListener("change",load);
})();

</script>
</body>
</html>
