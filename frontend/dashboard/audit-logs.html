<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Audit Logs | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-dark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Audit Logs</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Audit log</h2><div class="panel-actions"><select class="select" id="al-filter" style="min-width:180px;font-size:var(--fs-sm);padding:0.5em 0.8em;"><option value="">All actions</option><option>booking_created</option><option>payment_recorded</option><option>check_in</option><option>check_out</option><option>booking_cancelled</option></select></div></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th class="hide-sm">Detail</th><th class="hide-sm">IP</th></tr></thead>
      <tbody data-tbody="audit"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=audit]");
  var logs=[];

  function time(e){ return e.timestamp || e.created_at || e.time || null; }
  function user(e){ return e.user || (e.user_name) || "System"; }
  function action(e){ return e.action || e.event || e.verb || ""; }
  function detail(e){ return e.description || e.detail || e.message || ""; }
  function ip(e){ return e.ip_address || e.ip || ""; }

  function render(list){
    tbody.innerHTML=list.map(function(e){
      return '<tr><td class="caption">'+JONE.formatDateTime(time(e))+'</td><td>'+JONE.esc(user(e))+'</td><td><span class="badge">'+JONE.esc(action(e).replace(/_/g," "))+'</span></td><td class="hide-sm">'+JONE.esc(detail(e))+'</td><td class="hide-sm caption">'+JONE.esc(ip(e))+'</td></tr>';
    }).join("") || '<tr><td colspan="5"><div class="empty-state"><span data-icon="fileText"></span><h3>No audit entries yet</h3></div></td></tr>';
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var res=await window.API.list("auditLogs");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      logs=list||[];
      if(!logs.length){ DATA.empty(tbody,"fileText","No audit entries yet","Actions performed by staff will be recorded here.",5); return; }
      render(logs);
    }catch(err){ DATA.error(tbody,"Audit log couldn't be loaded","Please try again in a moment.",5); }
  }
  load();

  var al=document.getElementById("al-filter");
  if(al) al.addEventListener("change",function(e){
    var f=e.target.value.toLowerCase().replace(/_/g," ");
    var list=logs.filter(function(x){ return !f || (action(x)+" "+user(x)+" "+detail(x)).toLowerCase().indexOf(f)>-1; });
    render(list);
  });
})();

</script>
</body>
</html>
