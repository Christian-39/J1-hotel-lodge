<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Payments | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-dark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Payments</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="p-q">Search</label><input class="input" id="p-q" placeholder="Reference, guest"></div>
    <div class="field"><label class="field-label" for="p-method">Method</label><select class="select" id="p-method"><option value="">All</option><option>paystack</option><option>cash</option><option>pos</option><option>bank_transfer</option></select></div>
    <div class="field"><label class="field-label" for="p-status">Status</label><select class="select" id="p-status"><option value="">All</option><option>paid</option><option>pending</option><option>failed</option></select></div>
  </div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Payment ref</th><th>Booking</th><th class="hide-sm">Guest</th><th>Method</th><th class="hide-sm">Date</th><th>Amount</th><th>Status</th><th class="hide-sm">By</th></tr></thead>
      <tbody data-tbody="payments"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=payments]");

  function ref(p){ return p.reference || p.ref || p.reference_number || "—"; }
  function bookingRef(p){ return p.booking_ref || p.booking || (p.booking&&(p.booking.reference||p.booking.ref)) || "—"; }
  function guestName(p){ return p.guest_name || (p.guest&&(p.guest.full_name||p.guest.name)) || "—"; }
  function method(p){ return p.method || p.payment_method || ""; }
  function date(p){ return p.paid_at || p.date || p.created_at || null; }
  function amount(p){ return p.amount != null ? p.amount : p.total; }
  function by(p){ return p.paid_by || (p.user&&p.user.name) || "—"; }

  function render(list){
    if(!list.length){ tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><span data-icon="creditCard"></span><h3>No payments found</h3></div></td></tr>'; JONE.icons.inject(tbody); return; }
    tbody.innerHTML=list.map(function(p){
      var b=bookingRef(p);
      return '<tr><td>'+JONE.esc(ref(p))+'</td><td>'+(b==="—"?JONE.esc(b):'<a href="booking-details.html?ref='+encodeURIComponent(b)+'">'+JONE.esc(b)+'</a>')+'</td><td class="hide-sm">'+JONE.esc(guestName(p))+'</td><td>'+JONE.esc(method(p).replace(/_/g," "))+'</td><td class="hide-sm">'+JONE.formatDate(date(p),"mid")+'</td><td class="num">'+JONE.formatNaira(amount(p))+'</td><td>'+JONE.dashboard.statusPill(p.status)+'</td><td class="hide-sm">'+JONE.esc(by(p))+'</td></tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var res=await window.API.list("payments");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      if(!(list||[]).length){ DATA.empty(tbody,"creditCard","No payments found","Payments will appear here once recorded.",8); return; }
      render(list);
    }catch(err){ DATA.error(tbody,"Payments couldn't be loaded","Please try again in a moment.",8); }
  }
  load();
})();

</script>
</body>
</html>
