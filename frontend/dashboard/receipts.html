<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Receipts | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-dark.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Receipts</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="rc-q">Search</label><input class="input" id="rc-q" placeholder="Booking ref, receipt no."></div>
  </div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Receipt</th><th>Booking</th><th class="hide-sm">Guest</th><th>Amount</th><th class="hide-sm">Issued</th><th></th></tr></thead>
      <tbody data-tbody="receipts"></tbody>
    </table></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=receipts]");

  function no(r){ return r.receipt_number || r.number || r.reference || "—"; }
  function booking(r){ return r.booking_ref || r.booking || (r.booking&&(r.booking.reference||r.booking.ref)) || "—"; }
  function guest(r){ return r.guest_name || (r.guest&&(r.guest.full_name||r.guest.name)) || "—"; }
  function amount(r){ return r.amount != null ? r.amount : r.total; }
  function issued(r){ return r.issued_at || r.date || r.created_at || null; }

  function render(list){
    tbody.innerHTML=list.map(function(r){
      var b=booking(r);
      return '<tr><td>'+JONE.esc(no(r))+'</td><td>'+JONE.esc(b)+'</td><td class="hide-sm">'+JONE.esc(guest(r))+'</td><td class="num">'+JONE.formatNaira(amount(r))+'</td><td class="hide-sm">'+JONE.formatDate(issued(r),"mid")+'</td><td><a class="btn btn-sm btn-outline" href="receipts.html?view='+encodeURIComponent(no(r))+'"><span data-icon="printer" data-size="15"></span> View</a></td></tr>';
    }).join("") || '<tr><td colspan="6"><div class="empty-state"><span data-icon="receipt"></span><h3>No receipts yet</h3></div></td></tr>';
    JONE.icons.inject(tbody);
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var res=await window.API.list("receipts");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      if(!(list||[]).length){ DATA.empty(tbody,"receipt","No receipts yet","Receipts generated for payments will appear here.",6); return; }
      render(list);
    }catch(err){ DATA.error(tbody,"Receipts couldn't be loaded","Please try again in a moment.",6); }
  }
  load();
})();

</script>
</body>
</html>
