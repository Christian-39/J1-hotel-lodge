<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bookings | J-ONE Staff</title>
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="stylesheet" href="../css/main.css">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("jone.theme"))}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Bookings</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="bk-q">Search</label><input class="input" id="bk-q" data-filter="q" placeholder="Ref, guest, phone, email"></div>
    <div class="field"><label class="field-label" for="bk-status">Status</label><select class="select" id="bk-status" data-filter="status"><option value="">All</option><option>confirmed</option><option>pending</option><option>cancelled</option><option>checked_in</option><option>checked_out</option></select></div>
    <div class="field"><label class="field-label" for="bk-pay">Payment</label><select class="select" id="bk-pay" data-filter="payment_status"><option value="">All</option><option>paid</option><option>partial</option><option>unpaid</option></select></div>
    <div class="field"><label class="field-label" for="bk-date">From</label><input class="input" type="date" id="bk-date" data-filter="from"></div>
    <div class="filter-actions"><button class="btn btn-sm" data-new-booking>New booking</button></div>
  </div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Reference</th><th class="hide-sm">Guest</th><th class="hide-sm">Room</th><th>Check-in</th><th class="hide-sm">Check-out</th><th>Status</th><th class="hide-sm">Payment</th><th class="hide-sm">Total</th><th></th></tr></thead>
      <tbody data-tbody="bookings"></tbody>
    </table></div>
    <div class="pagination" data-pagination></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/hotel-data.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.nav.initDashboardNav();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA = JONE.dashboard.DATA;
  var tbody = document.querySelector("[data-tbody=bookings]");

  /* Verified /api/admin/bookings/ row:
     { id, booking_reference, guest_name, guest_phone, guest_email,
       room_type_name, room_numbers[], check_in, check_out, nights,
       number_of_rooms, number_of_guests, total_amount, amount_paid,
       amount_due, currency, status, payment_status, source, created_at }
     Filters (server-side): status, payment_status, source, room_type,
     date_from, date_to, check_in, check_out, search, ordering. */
  function refOf(b){ return b.booking_reference || b.id || "—"; }
  function roomLabel(b){
    if (b.room_numbers && b.room_numbers.length) return b.room_numbers.join(", ");
    return b.room_type_name || "—";
  }

  function render(list){
    if(!tbody) return;
    if(!list.length){
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><span data-icon="search"></span><h3>No bookings found</h3><p>Adjust your search or filters.</p></div></td></tr>';
      JONE.icons.inject(tbody); return;
    }
    tbody.innerHTML = list.map(function(b){
      var ref = refOf(b);
      return '<tr>'+
        '<td><a class="nav-link" href="booking-details.html?ref='+encodeURIComponent(ref)+'">'+JONE.esc(ref)+'</a></td>'+
        '<td class="hide-sm">'+JONE.esc(b.guest_name||"—")+'</td>'+
        '<td class="hide-sm">'+JONE.esc(roomLabel(b))+'</td>'+
        '<td>'+JONE.esc(b.check_in?JONE.formatDate(b.check_in,"mid"):"—")+'</td>'+
        '<td class="hide-sm">'+JONE.esc(b.check_out?JONE.formatDate(b.check_out,"mid"):"—")+'</td>'+
        '<td>'+JONE.dashboard.statusPill(b.status)+'</td>'+
        '<td class="hide-sm">'+JONE.dashboard.statusPill(b.payment_status)+'</td>'+
        '<td class="hide-sm num">'+JONE.esc(JONE.formatNaira(b.total_amount))+'</td>'+
        '<td><a class="btn btn-sm btn-outline" href="booking-details.html?ref='+encodeURIComponent(ref)+'">View</a></td>'+
      '</tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  function filters(){
    var f = { page_size: 50, ordering: "-created_at" };
    var q = document.getElementById("bk-q"); if (q && q.value.trim()) f.search = q.value.trim();
    var st = document.getElementById("bk-status"); if (st && st.value) f.status = st.value;
    var py = document.getElementById("bk-pay"); if (py && py.value) f.payment_status = py.value;
    var dt = document.getElementById("bk-date"); if (dt && dt.value) f.check_in = dt.value;
    return f;
  }

  var debouncedLoad = JONE.debounce ? JONE.debounce(load, 300) : load;
  ["bk-q","bk-status","bk-pay","bk-date"].forEach(function(id){
    var el=document.getElementById(id);
    if(el){ el.addEventListener(id==="bk-q" ? "input" : "change", debouncedLoad); }
  });

  // Pre-fill the search from the URL (e.g. guest history handoff).
  (function(){
    var pre = new URLSearchParams(location.search).get("search");
    if (pre) { var q = document.getElementById("bk-q"); if (q && !q.value) q.value = pre; }
  })();

  /* ------------------- New booking (walk-in / phone) -------------------
     Verified POST /api/admin/bookings/ contract — AdminBookingCreateSerializer:
     { room_type (slug), check_in, check_out, rooms, adults, children,
       source: WALK_IN|PHONE, status: PENDING|CONFIRMED, offer_code?,
       special_requests?, internal_notes?, guest: { first_name, last_name,
       email, phone } } — the backend validates availability and computes
       every amount. The response is the authoritative booking. */
  var roomTypes = [];
  async function loadTypes(){
    try{
      var res = await window.API.list("roomTypes", { page_size: 100 });
      roomTypes = window.API.normalizeList(res.data, res.pagination).items.map(function(t){ return { value: t.slug, label: t.name + " \u2014 " + JONE.formatNaira(t.base_price) + " / night" }; });
    }catch(_){ roomTypes = []; }
  }

  var newBtn = document.querySelector("[data-new-booking]");
  if (newBtn) newBtn.addEventListener("click", async function(){
    if (!roomTypes.length) await loadTypes();
    var today = JONE.hotelTodayISO();
    var tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,10);
    var out = await JONE.dashboard.formModal({
      title: "New booking (walk-in / phone)",
      submitText: "Create booking",
      wide: true,
      fields: [
        { name: "room_type", label: "Room type", type: "select", required: true, options: roomTypes.length ? roomTypes : [{ value: "", label: "No room types configured" }] },
        { name: "check_in", label: "Check-in", type: "date", required: true, value: today },
        { name: "check_out", label: "Check-out", type: "date", required: true, value: tomorrow },
        { name: "rooms", label: "Rooms", type: "number", required: true, value: 1 },
        { name: "adults", label: "Adults", type: "number", required: true, value: 1 },
        { name: "children", label: "Children", type: "number", value: 0 },
        { name: "source", label: "Source", type: "select", options: [{ value: "WALK_IN", label: "Walk-in" }, { value: "PHONE", label: "Phone" }], value: "WALK_IN" },
        { name: "status", label: "Status", type: "select", options: [{ value: "CONFIRMED", label: "Confirmed" }, { value: "PENDING", label: "Pending payment" }], value: "CONFIRMED" },
        { name: "offer_code", label: "Offer code (optional)", value: "" },
        { name: "special_requests", label: "Special requests", type: "textarea", rows: 2, value: "" },
        { name: "internal_notes", label: "Internal notes", type: "textarea", rows: 2, value: "" },
        { name: "guest_first_name", label: "Guest first name", required: true },
        { name: "guest_last_name", label: "Guest last name", required: true },
        { name: "guest_email", label: "Guest email", type: "email", required: true },
        { name: "guest_phone", label: "Guest phone", required: true }
      ],
      onSubmit: function(v){
        var payload = {
          room_type: v.room_type,
          check_in: v.check_in,
          check_out: v.check_out,
          rooms: Number(v.rooms || 1),
          adults: Number(v.adults || 1),
          children: Number(v.children || 0),
          source: v.source,
          status: v.status,
          special_requests: v.special_requests || "",
          internal_notes: v.internal_notes || "",
          guest: { first_name: v.guest_first_name, last_name: v.guest_last_name, email: v.guest_email, phone: v.guest_phone }
        };
        if (v.offer_code) payload.offer_code = v.offer_code;
        return window.API.create("bookings", payload).then(function(res){
          var ref = res && res.data && res.data.booking_reference;
          JONE.ui.toast("Booking " + (ref || "") + " created.", "success");
        });
      }
    });
    if (out) load();
  });

  async function load(){
    DATA.loading(tbody);
    try {
      var res = await window.API.list("bookings", filters());
      var list = window.API.normalizeList(res.data, res.pagination).items;
      render(list || []);
    } catch(err){
      DATA.error(tbody, "Bookings couldn't be loaded", (err && err.message) || "Please try again in a moment.", 9);
    }
  }
  load();
})();

</script>
</body>
</html>
